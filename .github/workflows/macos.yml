name: macOS

on:
  pull_request:
    branches:
      - main
    paths:
      - macOS/**
      - contracts/**
      - .github/workflows/macos.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # The settings UI currently uses an API introduced in the macOS 27 SDK.
    # GitHub provides this Xcode 27 image as a public-preview runner.
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
          xcrun --sdk macosx --show-sdk-path

      - name: Build Debug
        run: |
          xcodebuild \
            -project macOS/DisplaySwitcher.xcodeproj \
            -scheme DisplaySwitcher \
            -configuration Debug \
            -derivedDataPath macOS/.build/xcode-debug \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Run unit tests
        run: |
          xcodebuild \
            -project macOS/DisplaySwitcher.xcodeproj \
            -scheme DisplaySwitcher \
            -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/DisplaySwitcher-xcode-test" \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Build, package, and verify Release
        run: ./macOS/scripts/build-app.sh

      - name: Verify artifacts
        run: |
          test -d macOS/outputs/DisplaySwitcher.app
          test -f "macOS/outputs/DisplaySwitcher-macOS-$(uname -m).zip"
          codesign --verify --deep --strict macOS/outputs/DisplaySwitcher.app

      - name: Upload unsigned test package
        uses: actions/upload-artifact@v6
        with:
          name: DisplaySwitcher-macOS-${{ runner.arch }}-unsigned
          path: macOS/outputs/DisplaySwitcher-macOS-*.zip
          if-no-files-found: error
